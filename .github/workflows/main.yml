name: Build PlayerCannon

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package --file pom.xml

      - name: Verify jar
        run: |
          unzip -l target/PlayerCannon.jar
          unzip -l target/PlayerCannon.jar | grep -q "plugin.yml"
          unzip -l target/PlayerCannon.jar | grep -q "de/playercannon/PlayerCannon.class"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlayerCannon
          path: target/PlayerCannon.jar
          if-no-files-found: error

      - name: Create release with direct jar
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Build {0}', github.run_number) }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          files: target/PlayerCannon.jar
          generate_release_notes: true
